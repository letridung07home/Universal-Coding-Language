# Configuration for `cargo deny` (https://github.com/EmbarkStudios/cargo-deny).
#
# UCL has no runtime dependencies; the only third-party crates in the tree
# come from the fuzz harness (`libfuzzer-sys` and its transitive deps). This
# file keeps it that way: every push is checked for known advisories,
# unexpected duplicate or unregistered crates, and licenses incompatible with
# UCL's MIT OR Apache-2.0 licensing.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

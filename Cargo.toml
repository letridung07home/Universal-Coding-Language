[package]
name = "universal-coding-language"
version = "0.8.2"
edition = "2024"
rust-version = "1.85"
description = "A universal coding language that excels in every task possible"
repository = "https://github.com/letridung07home/Universal-Coding-Language.git"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["language", "interpreter", "compiler"]
categories = ["compilers"]

[lib]
name = "ucl"
path = "src/lib.rs"

[[bin]]
name = "ucl"
path = "src/main.rs"

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

name: Fuzz

on:
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: "Fuzzing budget per target in minutes"
        default: "1"
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lexer, parser, pipeline]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Set fuzzing budget
        id: budget
        # Manual dispatches default to a 1-minute smoke test; the nightly
        # schedule always gets the full 10 minutes.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=600" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=$(( ${{ inputs.fuzz_minutes || 1 }} * 60 ))" >> "$GITHUB_OUTPUT"
          fi

      - name: Fuzz ${{ matrix.target }} (${{ steps.budget.outputs.seconds }} seconds)
        # Bounded programs can still generate heavy allocator churn (for
        # example loops that rebuild an accumulating string every iteration);
        # under ASan the default quarantine (256 MB) plus per-allocation
        # metadata made such inputs reach ~3 GB resident each. A small
        # quarantine keeps freed pages recyclable so resident memory tracks
        # live heap instead of churn.
        env:
          ASAN_OPTIONS: quarantine_size_mb=8:malloc_context_size=16
        # Four workers saturate the runner's CPU cores: same wall-clock
        # budget as a single-worker run, roughly four times the executions.
        # Explicit resource limits head off libFuzzer's tighter defaults
        # (2048 MB RSS, no per-run timeout) tripping on pathological-but-
        # bounded inputs rather than genuine bugs.
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -jobs=4 -workers=4 -max_total_time=${{ steps.budget.outputs.seconds }} -rss_limit_mb=4096 -malloc_limit_mb=1024 -timeout=25
        working-directory: fuzz

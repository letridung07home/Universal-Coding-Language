name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test binary
        run: ./target/release/ucl --help > /dev/null

      - name: Package release artifacts
        run: |
          mkdir -p dist/ucl-x86_64-linux
          cp target/release/ucl dist/ucl-x86_64-linux/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/ucl-x86_64-linux/
          tar -czf dist/ucl-x86_64-linux.tar.gz -C dist ucl-x86_64-linux
          (cd dist && sha256sum ucl-x86_64-linux.tar.gz > sha256sums.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/ucl-x86_64-linux.tar.gz dist/sha256sums.txt

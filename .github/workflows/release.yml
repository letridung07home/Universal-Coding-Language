name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so `git describe` can find the previous release tag.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test binary
        run: ./target/release/ucl --help > /dev/null

      - name: Package release artifacts
        run: |
          mkdir -p dist/ucl-x86_64-linux
          cp target/release/ucl dist/ucl-x86_64-linux/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/ucl-x86_64-linux/
          tar -czf dist/ucl-x86_64-linux.tar.gz -C dist ucl-x86_64-linux
          (cd dist && sha256sum ucl-x86_64-linux.tar.gz > sha256sums.txt)

      - name: Extract release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The entry's heading may carry a date suffix, so match by prefix.
          awk -v section="## $version" '
            index($0, section) == 1 { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          # Fail loudly if the changelog has no entry for this version.
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "No CHANGELOG.md entry found for version $version" >&2
            exit 1
          fi
          previous_tag="$(git describe --abbrev=0 --tags "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            cat "$RUNNER_TEMP/release-notes.md"
            if [ -n "$previous_tag" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_REF_NAME}"
            fi
          } > "$RUNNER_TEMP/release-notes-final.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/release-notes-final.md" --title "UCL ${GITHUB_REF_NAME#v}" dist/ucl-x86_64-linux.tar.gz dist/sha256sums.txt

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: |
          set +e
          cargo test --all-features -- --test-threads=1 2>&1 | tee /tmp/tests.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*m//g' /tmp/tests.txt | tail -n 12 | python3 -c 'import sys, urllib.parse
for i, line in enumerate(sys.stdin):
    print("::error::t" + str(i) + "=" + urllib.parse.quote(line.rstrip(), safe=""))'
          fi
          exit "$status"

      - name: Check release metadata
        run: ./scripts/check-release-metadata.sh

      - name: Check documentation builds without warnings
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: Build release binary
        run: cargo build --release --locked

  platforms:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

  security:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check advisories, licenses, and duplicate crates
        uses: EmbarkStudios/cargo-deny-action@v2

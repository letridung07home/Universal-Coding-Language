name: Prepare validated UCL v2.0.2

on:
  push:
    branches:
      - release/v2.0.2-final

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: release/v2.0.2-final
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply release patch
        run: python3 .github/scripts/prepare_v2_0_2.py

      - name: Format
        run: cargo fmt --all

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Check release metadata
        run: ./scripts/check-release-metadata.sh

      - name: Check documentation
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: Build release binary
        run: cargo build --release --locked

      - name: Commit validated release
        run: |
          git rm .github/workflows/prepare-v2.0.2-final.yml .github/scripts/prepare_v2_0_2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.0.2: enforce complete strict signatures"
          git push origin HEAD:release/v2.0.2-final
